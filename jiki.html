// Перемішування відповідей
function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

// Відмальовка питань
const quizContainer = document.getElementById("quiz-anchor");
examData.forEach((item, idx) => {
    shuffle(item.a);
    const box = document.createElement("div");
    box.className = "question-box";
    box.dataset.answer = item.c;

    let html = `<b>ПИТАННЯ ${idx + 1}</b><br><p>${item.q}</p>`;
    item.a.forEach(opt => {
        html += `
            <label class="answer-label">
                <input type="radio" name="q${idx}" value="${opt}" onchange="updateProgress()">
                <span>${opt}</span>
            </label>`;
    });
    html += `<div class="feedback"></div>`;
    box.innerHTML = html;
    quizContainer.appendChild(box);
});

// Таймер
let startTime = Date.now();
setInterval(() => {
    let diff = Math.floor((Date.now() - startTime) / 1000);
    let m = String(Math.floor(diff / 60)).padStart(2, '0');
    let s = String(diff % 60).padStart(2, '0');
    document.getElementById("stat-timer").innerText = `Час: ${m}:${s}`;
}, 1000);

// Оновлення прогресу
function updateProgress() {
    let answered = document.querySelectorAll('input:checked').length;
    let total = examData.length;
    let pct = Math.round((answered / total) * 100);
    document.getElementById("progress-fill").style.width = pct + "%";
    document.getElementById("stat-count").innerText = `Виконано: ${answered}/${total}`;
}

// Завершення тесту
function finishExam() {
    let score = 0;
    document.querySelectorAll(".question-box").forEach(box => {
        let correct = box.dataset.answer;
        let selected = box.querySelector("input:checked");
        let msg = box.querySelector(".feedback");
        msg.style.display = "block";

        if (!selected) {
            msg.innerHTML = `<div class="wrong-ui">Пропущено! (Правильно: ${correct})</div>`;
        } else if (selected.value === correct) {
            score++;
            msg.innerHTML = `<div class="correct-ui">Вірно!</div>`;
        } else {
            msg.innerHTML = `<div class="wrong-ui">Помилка. (Правильно: ${correct})</div>`;
        }
    });

    const summary = document.getElementById("summary");
    summary.style.display = "block";
    let finalPct = Math.round((score / examData.length) * 100);
    summary.innerHTML = `
        <h2>Результати тестування</h2>
        <p style="font-size: 2em; margin: 10px 0;">${score} / ${examData.length}</p>
        <p>Результат: ${finalPct}%</p>
        <p>${finalPct >= 60 ? "ТЕСТ СКЛАДЕНО ✅" : "ТЕСТ НЕ СКЛАДЕНО ❌"}</p>
    `;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
